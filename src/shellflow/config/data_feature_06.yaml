# Data feature configuration for REAL DATA training — extended conditioning
# Based on data_feature_05 + 8 new conditioning fields for improved kinematics:
#   lep_ptvarcone30, lep_topoetcone20, lep_d0sig, tau_nTracks, tau_RNNJetScore,
#   photon_topoetcone40, photon_ptcone20, largeRJet_D2

particles:
  # Event metadata (non-physics identification fields)
  metadata:
    fields:
      - runNumber          # Run number of the event
      - eventNumber        # Event number (with runNumber uniquely identifies event)
    type_encoding: -1      # Special encoding for metadata (not a physical particle)
    feature_ids: [-1, -2]

  # Missing transverse energy
  met:
    fields:
      - met               # Transverse energy of the missing momentum vector
      - met_phi           # Azimuthal angle of the missing momentum vector
    type_encoding: 0
    feature_ids: [2, 4]

  # Leptons (electrons and muons)
  lepton:
    fields:
      - lep_pt                    # Transverse momentum
      - lep_eta                   # Pseudo-rapidity
      - lep_phi                   # Azimuthal angle
      - lep_e                     # Energy
      - lep_charge                # Electric charge
      - lep_z0                    # z-coordinate of track wrt. primary vertex
      - lep_d0                    # Transverse impact parameter wrt. primary vertex
      - lep_ptvarcone30           # Variable-cone track isolation (R=0.3)
      - lep_topoetcone20          # Topological calorimeter isolation (R=0.2)
      - lep_d0sig                 # d0 significance of track
    type_encoding_field: lep_type # 11 for electron, 13 for muon
    feature_ids: [2, 3, 4, 5, 6, 33, 41, 39, 40, 42]

  # Photons
  photon:
    fields:
      - photon_pt             # Transverse momentum
      - photon_eta            # Pseudo-rapidity
      - photon_phi            # Azimuthal angle
      - photon_e              # Energy
      - photon_charge         # Photon Charge, does not exist in the original data but created
      - photon_topoetcone40   # Topological ET isolation in cone R=0.4
      - photon_ptcone20       # Track isolation in cone R=0.2
    type_encoding: 22
    feature_ids: [2, 3, 4, 5, 6, 11, 38]

  # Hadronically decaying tau leptons
  tau:
    fields:
      - tau_pt            # Transverse momentum
      - tau_eta           # Pseudo-rapidity
      - tau_phi           # Azimuthal angle
      - tau_e             # Energy
      - tau_charge        # Electric charge
      - tau_nTracks       # Number of tracks in hadronic tau decay (1 or 3)
      - tau_RNNJetScore   # RNN-based jet discrimination score (real vs fake tau)
    type_encoding: 15
    feature_ids: [2, 3, 4, 5, 6, 7, 8]

  # Jets (anti-kt R=0.4)
  jet:
    fields:
      - jet_pt              # Transverse momentum
      - jet_eta             # Pseudo-rapidity
      - jet_phi             # Azimuthal angle
      - jet_e               # Energy
      - jet_btag_quantile   # b-tagging score as quantile
      - jet_jvt             # Jet Vertex Tagger score for pileup suppression
    type_encoding: 1
    feature_ids: [2, 3, 4, 5, 10, 44]

  # Large-R jets (anti-kt R=1.0)
  largeRjet:
    fields:
      - largeRJet_pt          # Transverse momentum
      - largeRJet_eta         # Pseudo-rapidity
      - largeRJet_phi         # Azimuthal angle
      - largeRJet_e           # Energy
      - largeRJet_m           # Invariant mass
      - largeRJet_D2          # D2 substructure variable for W/Z-boson tagging
    type_encoding: 10         # Custom encoding for large-R jets
    feature_ids: [2, 3, 4, 5, 50, 51]
